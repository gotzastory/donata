<svg viewBox="0 0 1420 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>

    <symbol id="icon-browser" viewBox="0 0 40 40">
      <rect x="3" y="6" width="34" height="28" rx="3" fill="none" stroke="#334155" stroke-width="2.5"/>
      <line x1="3" y1="14" x2="37" y2="14" stroke="#334155" stroke-width="2.5"/>
      <circle cx="8" cy="10" r="1.6" fill="#334155"/>
      <circle cx="13" cy="10" r="1.6" fill="#334155"/>
    </symbol>

    <symbol id="icon-node" viewBox="0 0 40 40">
      <path d="M20 2 L36 11 V29 L20 38 L4 29 V11 Z" fill="#3c873a"/>
      <text x="20" y="26" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace">JS</text>
    </symbol>

    <symbol id="icon-ws" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#6d28d9"/>
      <path d="M8 16 C11 12, 14 12, 17 16 C20 20, 23 20, 26 16" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M8 24 C11 20, 14 20, 17 24 C20 28, 23 28, 26 24" fill="none" stroke="#ffffff" stroke-width="2.2"/>
      <path d="M28 12 L33 12 L33 28 L28 28" fill="none" stroke="#ffffff" stroke-width="2"/>
    </symbol>

    <symbol id="icon-stripe" viewBox="0 0 40 40">
      <rect x="2" y="2" width="36" height="36" rx="8" fill="#635bff"/>
      <text x="20" y="27" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="Georgia, serif">S</text>
    </symbol>

    <symbol id="icon-obs" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#302e31"/>
      <circle cx="20" cy="20" r="9" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="20" cy="20" r="3" fill="#ffffff"/>
    </symbol>

    <symbol id="icon-docker" viewBox="0 0 40 40">
      <g fill="#2496ed">
        <rect x="6" y="18" width="6" height="6" rx="1"/>
        <rect x="13" y="18" width="6" height="6" rx="1"/>
        <rect x="20" y="18" width="6" height="6" rx="1"/>
        <rect x="13" y="11" width="6" height="6" rx="1"/>
        <rect x="20" y="11" width="6" height="6" rx="1"/>
        <path d="M2 24 C2 24 4 34 18 34 C29 34 34 26 36 21 C37 21 38.5 20 38.5 18 C37 17 35 17.5 35 17.5 C34 20 31 22 27 22 L4 22 C2.5 22 2 23 2 24 Z"/>
      </g>
    </symbol>

    <symbol id="icon-cloud" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#f38020"/>
      <path d="M11 25 a5 5 0 0 1 1-9.9 A7 7 0 0 1 25 14 a5.5 5.5 0 0 1 1 11 Z" fill="#ffffff"/>
    </symbol>

    <symbol id="icon-tts" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#0ea5e9"/>
      <path d="M9 16 H14 L21 10 V30 L14 24 H9 Z" fill="#ffffff"/>
      <path d="M26 14 C29 17, 29 23, 26 26" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M29.5 11 C34 16, 34 24, 29.5 29" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>

    <symbol id="icon-webhook" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#1f2937"/>
      <path d="M11 21 L17 27 L29 13" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="icon-lock" viewBox="0 0 40 40">
      <rect x="9" y="18" width="22" height="17" rx="3" fill="#64748b"/>
      <path d="M13 18 V12 a7 7 0 0 1 14 0 V18" fill="none" stroke="#64748b" stroke-width="3.5"/>
      <circle cx="20" cy="26" r="2.6" fill="#ffffff"/>
    </symbol>

    <symbol id="icon-avatar" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="#f43f5e"/>
      <circle cx="20" cy="15" r="6.5" fill="#ffffff"/>
      <path d="M8 33 C8 24, 32 24, 32 33" fill="#ffffff"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1420" height="640" fill="#f7f8fa"/>

  <text x="40" y="40" font-size="23" font-weight="700" fill="#0f172a">Donata Architecture</text>
  <text x="40" y="61" font-size="13.5" fill="#64748b">Self-hosted donation &amp; stream alert system · Node.js + Express + TypeScript · Stripe Checkout · WebSocket · Docker Compose</text>

  <!-- legend -->
  <rect x="1150" y="20" width="240" height="88" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#cardShadow)"/>
  <line x1="1166" y1="39" x2="1196" y2="39" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1204" y="43" font-size="12" fill="#334155">HTTP request / response</text>
  <line x1="1166" y1="62" x2="1196" y2="62" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1204" y="66" font-size="12" fill="#334155">Stripe webhook (signed)</text>
  <line x1="1166" y1="85" x2="1196" y2="85" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="1204" y="89" font-size="12" fill="#334155">WebSocket push</text>

  <!-- docker-compose boundary -->
  <rect x="560" y="150" width="560" height="230" rx="14" fill="#eff6ff" stroke="#2496ed" stroke-width="1.5" stroke-dasharray="7,5"/>
  <use href="#icon-docker" x="576" y="160" width="26" height="26"/>
  <text x="608" y="177" font-size="12.5" font-weight="600" fill="#1d4ed8">docker-compose.yml</text>

  <!-- local dev note -->
  <rect x="24" y="150" width="472" height="230" rx="14" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="7,5"/>
  <use href="#icon-node" x="40" y="160" width="24" height="24"/>
  <text x="70" y="177" font-size="12.5" font-weight="600" fill="#0369a1">Local dev — pnpm dev / build / start</text>
  <text x="40" y="365" font-size="11" fill="#64748b">ts-node-dev, hits localhost:3000 directly, no tunnel</text>

  <!-- Browser (donor) -->
  <g>
    <rect x="44" y="196" width="170" height="120" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <use href="#icon-browser" x="109" y="208" width="40" height="40"/>
    <text x="129" y="272" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Donor browser</text>
    <text x="129" y="288" font-size="10.5" fill="#94a3b8" text-anchor="middle">index.html</text>
    <text x="129" y="302" font-size="10.5" fill="#94a3b8" text-anchor="middle">donation form</text>
  </g>

  <!-- Express app -->
  <g>
    <rect x="600" y="196" width="220" height="164" rx="12" fill="#ffffff" stroke="#3c873a" stroke-width="2" filter="url(#cardShadow)"/>
    <use href="#icon-node" x="690" y="208" width="40" height="40"/>
    <text x="710" y="264" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Express server</text>
    <text x="710" y="280" font-size="10.5" fill="#334155" text-anchor="middle">src/server.ts</text>
    <text x="710" y="296" font-size="10" fill="#64748b" text-anchor="middle">/api/create-payment</text>
    <text x="710" y="309" font-size="10" fill="#64748b" text-anchor="middle">/stripe-webhook</text>
    <text x="710" y="322" font-size="10" fill="#64748b" text-anchor="middle">/test-donation</text>
    <rect x="683" y="332" width="54" height="17" rx="8.5" fill="#ecfdf5"/>
    <text x="710" y="344" font-size="10" font-family="Consolas, monospace" fill="#0f766e" text-anchor="middle">:3000</text>
  </g>

  <!-- WS server -->
  <g>
    <rect x="600" y="150" width="220" height="0" fill="none"/>
    <rect x="852" y="196" width="180" height="112" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2" filter="url(#cardShadow)"/>
    <use href="#icon-ws" x="922" y="208" width="40" height="40"/>
    <text x="942" y="272" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">WS clients</text>
    <text x="942" y="288" font-size="10" fill="#334155" text-anchor="middle">Set&lt;WebSocket&gt;</text>
    <text x="942" y="301" font-size="9.5" fill="#94a3b8" text-anchor="middle">broadcast(data)</text>
  </g>

  <!-- Cloudflared -->
  <g>
    <rect x="600" y="322" width="220" height="42" rx="10" fill="#fff7ed" stroke="#f38020" stroke-width="1.5"/>
    <use href="#icon-cloud" x="608" y="329" width="26" height="26"/>
    <text x="700" y="348" font-size="11.5" font-weight="600" fill="#9a3412" text-anchor="middle">cloudflared — quick tunnel (optional)</text>
  </g>

  <!-- Stripe -->
  <g>
    <rect x="1080" y="196" width="200" height="112" rx="12" fill="#ffffff" stroke="#635bff" stroke-width="2" filter="url(#cardShadow)"/>
    <use href="#icon-stripe" x="1160" y="208" width="40" height="40"/>
    <text x="1180" y="272" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Stripe Checkout</text>
    <text x="1180" y="288" font-size="10.5" fill="#334155" text-anchor="middle">PromptPay / Card, THB</text>
  </g>

  <!-- OBS overlay -->
  <g>
    <rect x="44" y="196" width="0" height="0"/>
  </g>

  <!-- arrows: donor -> express (create payment) -->
  <line x1="214" y1="240" x2="596" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="330" y="222" width="170" height="18" rx="4" fill="#f7f8fa"/>
  <text x="415" y="235" font-size="10.5" fill="#334155" text-anchor="middle">POST /api/create-payment</text>

  <!-- express -> stripe (create session) -->
  <line x1="820" y1="232" x2="1076" y2="232" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="948" y="226" font-size="10" fill="#334155" text-anchor="middle">create Checkout Session</text>

  <!-- donor -> stripe (redirect to checkout) -->
  <path d="M214 280 C 600 470, 950 470, 1180 312" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="450" width="220" height="18" rx="4" fill="#f7f8fa"/>
  <text x="670" y="463" font-size="10.5" fill="#334155" text-anchor="middle">browser redirect → session.url</text>

  <!-- stripe -> express webhook -->
  <path d="M1180 308 C 1180 400, 900 400, 820 400" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="852" y="390" width="230" height="18" rx="4" fill="#f7f8fa"/>
  <text x="967" y="403" font-size="10.5" fill="#166534" text-anchor="middle">payment_intent.succeeded (signed)</text>

  <!-- express -> ws clients (dashed broadcast) -->
  <line x1="852" y1="252" x2="826" y2="252" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="838" y="242" font-size="9.5" fill="#6d28d9" text-anchor="middle">broadcast()</text>

  <!-- ws clients -> OBS overlay (below, outside compose box) -->
  <g>
    <rect x="944" y="450" width="200" height="112" rx="12" fill="#ffffff" stroke="#302e31" stroke-width="2" filter="url(#cardShadow)"/>
    <use href="#icon-obs" x="1024" y="462" width="40" height="40"/>
    <text x="1044" y="526" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">OBS overlay</text>
    <text x="1044" y="542" font-size="10.5" fill="#334155" text-anchor="middle">overlay.html · Browser Source</text>
  </g>
  <line x1="942" y1="308" x2="1044" y2="446" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <text x="1075" y="390" font-size="10" fill="#6d28d9" text-anchor="middle">donation event</text>
  <text x="1075" y="403" font-size="10" fill="#6d28d9" text-anchor="middle">(nickname, amount, message, audio)</text>

  <!-- TTS + avatar row, left side, below express -->
  <g>
    <rect x="600" y="450" width="200" height="94" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#cardShadow)"/>
    <use href="#icon-tts" x="612" y="460" width="28" height="28"/>
    <text x="654" y="480" font-size="12" font-weight="600" fill="#0f172a">synthesizeSpeech()</text>
    <text x="612" y="502" font-size="10" fill="#334155">Google Translate TTS endpoint</text>
    <text x="612" y="516" font-size="10" fill="#334155">no API key · ~200 char chunks</text>
    <text x="612" y="530" font-size="9.5" fill="#94a3b8">fallback: Web Speech API (client)</text>
  </g>
  <line x1="700" y1="360" x2="700" y2="446" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="44" y="450" width="200" height="94" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" filter="url(#cardShadow)"/>
    <use href="#icon-avatar" x="56" y="460" width="28" height="28"/>
    <text x="98" y="480" font-size="12" font-weight="600" fill="#0f172a">generated avatar</text>
    <text x="56" y="502" font-size="10" fill="#334155">per-donor SVG, seeded by</text>
    <text x="56" y="516" font-size="10" fill="#334155">nickname · client-side, no assets</text>
  </g>

  <!-- footer note -->
  <text x="40" y="610" font-size="11.5" fill="#94a3b8">Payment metadata (nickname, message) round-trips through Stripe and returns in the webhook payload — no server-side donation store.</text>
</svg>
