<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/fonts.css">
    <style>
        :root {
            --alert-duration: 15s;
            --progress-duration: calc(var(--alert-duration) - 1s);
            --primary-color: #38D430;
            --accent-color: #FFE817;
            --bg-color: #101820;
            --panel-color: #131c26;
            --text-color: #DBE2E6;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: var(--font-body, var(--system-fonts));
        }

        body * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            pointer-events: none;
        }

        #alert-container {
            position: fixed;
            left: 50%;
            top: 20%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            min-width: 320px;
        }

        .alert-box {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            color: var(--text-color);
            margin-bottom: 20px;
            transform-origin: center top;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 24px rgba(56, 212, 48, 0.18));
            animation: alertIn 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) forwards,
                alertOut 0.4s cubic-bezier(0.6, -0.2, 0.8, 0) forwards var(--progress-duration);
        }

        /* glowing gradient border, drawn behind a slightly inset panel */
        .alert-box::before {
            content: '';
            position: absolute;
            inset: 0;
            padding: 2px;
            border-radius: inherit;
            background: linear-gradient(120deg, var(--primary-color), var(--accent-color), var(--primary-color));
            background-size: 200% 200%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: sheenShift 3.2s linear infinite;
            z-index: 2;
        }

        .progress-bar {
            position: relative;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            width: 0;
            animation: slideRight var(--progress-duration) linear forwards;
            transform: translateZ(0);
            z-index: 1;
            box-shadow: 0 0 10px rgba(56, 212, 48, 0.7);
        }

        .alert-content {
            position: relative;
            padding: 22px 24px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
            background: linear-gradient(165deg, rgba(19, 28, 38, 0.97), rgba(16, 24, 32, 0.97));
            backdrop-filter: blur(6px);
            min-height: 120px;
            max-width: 100%;
        }

        .icon-container {
            position: relative;
            border-radius: 50%;
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 0 3px var(--bg-color), 0 0 0 5px var(--primary-color),
                0 0 18px rgba(56, 212, 48, 0.6);
            animation: ringPulse 2.2s ease-in-out infinite;
        }

        .icon-container svg {
            width: 100%;
            height: 100%;
        }

        .text-content {
            flex: 1;
            min-width: 0;
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-word;
            animation: contentRise 0.5s ease-out 0.12s both;
        }

        .alert-header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
            max-width: 100%;
        }

        .username {
            font-family: var(--font-display, var(--system-fonts));
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--primary-color);
            text-shadow: 0 0 16px rgba(56, 212, 48, 0.45);
            flex-shrink: 1;
            min-width: 100px;
        }

        .donate-amount {
            font-family: var(--font-display, var(--system-fonts));
            font-size: 20px;
            font-weight: 700;
            color: var(--bg-color);
            background: linear-gradient(120deg, var(--accent-color), #ffef8a);
            padding: 4px 12px;
            border-radius: 999px;
            margin-left: auto;
            white-space: nowrap;
            box-shadow: 0 0 14px rgba(255, 232, 23, 0.45);
        }

        .message {
            font-size: 19px;
            line-height: 1.45;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            color: var(--text-color);
            max-width: 100%;
            animation: contentRise 0.5s ease-out 0.22s both;
        }

        @keyframes slideRight {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }

        @keyframes sheenShift {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 200% 50%;
            }
        }

        @keyframes ringPulse {

            0%,
            100% {
                box-shadow: 0 0 0 3px var(--bg-color), 0 0 0 5px var(--primary-color), 0 0 18px rgba(56, 212, 48, 0.6);
            }

            50% {
                box-shadow: 0 0 0 3px var(--bg-color), 0 0 0 5px var(--primary-color), 0 0 28px rgba(56, 212, 48, 0.95);
            }
        }

        @keyframes alertIn {
            0% {
                opacity: 0;
                transform: translateY(-28px) scale(0.92);
            }

            60% {
                opacity: 1;
                transform: translateY(4px) scale(1.015);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes alertOut {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-18px) scale(0.96);
            }
        }

        @keyframes contentRise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .alert-box,
            .icon-container,
            .alert-box::before,
            .text-content,
            .message {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        @media (max-width: 480px) {
            .alert-content {
                padding: 15px;
                gap: 15px;
            }

            .icon-container {
                width: 60px;
                height: 60px;
            }

            .username {
                font-size: 24px;
            }

            .donate-amount {
                font-size: 16px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div id="alert-container"></div>

    <script>
        function playDingSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;

                [880, 1320].forEach((freq, i) => {
                    const oscillator = ctx.createOscillator();
                    const gain = ctx.createGain();
                    oscillator.connect(gain);
                    gain.connect(ctx.destination);

                    oscillator.type = 'sine';
                    oscillator.frequency.value = freq;

                    const start = now + i * 0.12;
                    gain.gain.setValueAtTime(0, start);
                    gain.gain.linearRampToValueAtTime(0.3, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);

                    oscillator.start(start);
                    oscillator.stop(start + 0.4);
                });
            } catch (error) {
                console.error('Ding sound error:', error);
            }
        }

        function generateAvatarSvg(nickname) {
            const initial = (nickname || '?').trim().charAt(0).toUpperCase() || '?';

            let hash = 0;
            for (let i = 0; i < nickname.length; i++) {
                hash = nickname.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            const bgColor = `hsl(${hue}, 65%, 45%)`;

            return `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
                    <circle cx="24" cy="24" r="24" fill="${bgColor}" />
                    <text x="24" y="24" text-anchor="middle" dominant-baseline="central"
                          font-family="'Kanit', sans-serif" font-size="22" font-weight="700"
                          fill="#ffffff">${initial}</text>
                </svg>
            `;
        }

        class AlertQueue {
            constructor() {
                this.queue = [];
                this.isProcessing = false;
                this.baseAlertDuration = 30000;
                this.minAlertDuration = 10000;
            }

            add(alert) {
                this.queue.push(alert);
                if (!this.isProcessing) {
                    this.processNext();
                }
            }

            calculateDuration() {
                const thresholds = [
                    { queueSize: 15, duration: this.minAlertDuration },
                    { queueSize: 10, divider: 1.5 },
                    { queueSize: 5, divider: 1.5 },
                    { queueSize: 3, divider: 2 }
                ];

                let duration = this.baseAlertDuration;

                for (const threshold of thresholds) {
                    if (this.queue.length >= threshold.queueSize) {
                        if (threshold.duration) {
                            return threshold.duration;
                        }
                        duration = Math.max(duration / threshold.divider, this.minAlertDuration);
                    }
                }

                return duration;
            }

            async processNext() {
                if (this.queue.length === 0) {
                    this.isProcessing = false;
                    return;
                }

                this.isProcessing = true;
                const alert = this.queue.shift();
                const duration = this.calculateDuration();

                document.documentElement.style.setProperty('--alert-duration', duration / 1000 + 's');
                document.documentElement.style.setProperty('--progress-duration', (duration / 1000 - 1) + 's');

                await this.showAlert(alert, duration);
                this.processNext();
            }

            async showAlert(data, duration) {
                return new Promise(resolve => {
                    const alertBox = document.createElement('div');
                    alertBox.className = 'alert-box';

                    const sanitizeHtml = (str) => {
                        const div = document.createElement('div');
                        div.textContent = str;
                        return div.innerHTML;
                    };

                    let nickname, amount, message, audioContent;

                    if (data.metadata) {
                        nickname = sanitizeHtml(data.metadata.nickname);
                        amount = parseFloat(data.amount) / 100;
                        message = data.metadata.message ? sanitizeHtml(data.metadata.message) : '';
                        audioContent = data.audioContent || null;
                    } else {
                        nickname = sanitizeHtml(data.nickname);
                        amount = parseFloat(data.amount) / 100;
                        message = data.message ? sanitizeHtml(data.message) : '';
                        audioContent = data.audioContent || null;
                    }

                    alertBox.innerHTML = `
                        <div class="progress-bar"></div>
                        <div class="alert-content">
                            <div class="icon-container">
                                ${generateAvatarSvg(nickname)}
                            </div>
                            <div class="text-content">
                                <div class="alert-header">
                                    <span class="username">${nickname}</span>
                                    <span class="donate-amount">฿${amount.toFixed(2)}</span>
                                </div>
                                ${message ? `<div class="message">${message}</div>` : ''}
                            </div>
                        </div>
                    `;

                    const container = document.getElementById('alert-container');
                    container.innerHTML = '';
                    container.appendChild(alertBox);

                    playDingSound();

                    if (audioContent) {
                        const audio = new Audio(`data:audio/mp3;base64,${audioContent}`);
                        audio.play().catch(err => console.error('Audio playback error:', err));
                    } else if (message && 'speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(message);
                        utterance.lang = 'th-TH';

                        const thaiVoice = window.speechSynthesis.getVoices()
                            .find(voice => voice.lang.toLowerCase().startsWith('th'));

                        if (thaiVoice) {
                            utterance.voice = thaiVoice;
                        } else {
                            console.warn('No Thai voice installed on this system. Available voices:',
                                window.speechSynthesis.getVoices().map(v => v.lang));
                        }

                        utterance.onerror = (e) => console.error('Speech synthesis error:', e.error);
                        window.speechSynthesis.speak(utterance);
                    }

                    setTimeout(() => {
                        if (alertBox && alertBox.parentNode) {
                            alertBox.remove();
                        }
                        resolve();
                    }, duration);
                });
            }
        }

        const alertQueue = new AlertQueue();

        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                console.log('Voices loaded:', window.speechSynthesis.getVoices().map(v => `${v.name} (${v.lang})`));
            };
        }

        const connectWebSocket = () => {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'donation') {
                        alertQueue.add(data.donation);
                    }
                } catch (error) {
                    console.error('Error parsing WebSocket message:', error);
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected. Reconnecting...');
                setTimeout(connectWebSocket, 5000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        };

        connectWebSocket();
    </script>
</body>

</html>
