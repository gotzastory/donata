<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สนับสนุนสตรีม</title>
    <script src="https://js.stripe.com/v3/"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <div class="container">
        <h1>สนับสนุนช่อง GZ UKNOW</h1>

        <form id="payment-form" class="tip-form">
            <div class="input-group">
                <label for="amount">จำนวนเงิน (บาท)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="10"
                    step="1"
                    placeholder="ระบุจำนวนเงินหรือเลือกผู้เข้าแข่งขันด้านล่าง (ขั้นต่ำ 10 บาท)"
                    required
                >
            </div>

            <div class="input-group">
                <label for="nickname">ชื่อของคุณ</label>
                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    placeholder="ชื่อของคุณคืออะไร?"
                    required
                >
            </div>

            <div class="input-group">
                <label for="message">ข้อความ (ไม่บังคับ)</label>
                <textarea
                    id="message"
                    name="message"
                    rows="3"
                    placeholder="ข้อความของคุณ..."
                ></textarea>
            </div>

            <div id="error-message" class="error"></div>
            <button type="submit" id="submit-button" class="submit-button">สนับสนุน</button>
        </form>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
